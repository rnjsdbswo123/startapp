<!doctype html>
<html lang="ko" data-theme="dark" data-accent="청록">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Start</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">
  <div class="wrap">

    <header class="top">
      <div class="top-left">
        <div id="clock" class="clock">--:--</div>
        <div class="top-meta">
          <div id="date" class="date"></div>
          <div id="greeting" class="greeting"></div>
        </div>
      </div>
      <div class="weather">
        <span id="wx-icon" class="wx-icon"></span>
        <span>제주</span>
        <span id="wx-temp" class="wx-temp">—°</span>
        <span id="wx-label"></span>
      </div>
    </header>

    <form id="search" class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" placeholder="검색 또는 URL 입력" autocomplete="off" spellcheck="false" />
      <span class="kbd">/</span>
    </form>

    <main class="main">
      <section id="groups" class="groups"></section>

      <aside class="todo">
        <div class="todo-head">
          <span class="todo-title">할 일</span>
          <span id="todo-count" class="todo-count"></span>
        </div>
        <div id="tabs" class="tabs">
          <button type="button" data-tab="today">오늘<span class="tab-left"></span></button>
          <button type="button" data-tab="week">이번 주<span class="tab-left"></span></button>
        </div>
        <div class="todo-add">
          <span class="plus">+</span>
          <input id="draft" placeholder="할 일 추가" />
        </div>
        <div id="todo-list" class="todo-list"></div>
      </aside>
    </main>

    <form id="add-link" class="add-link hidden">
      <select id="f-group"></select>
      <input id="f-newgroup" class="hidden" placeholder="그룹 이름" />
      <input id="f-name" placeholder="이름" />
      <input id="f-url" placeholder="https://" />
      <button type="submit" class="btn-accent">추가</button>
      <span class="hint">링크 옆 × 로 삭제</span>
    </form>

    <footer class="foot">
      <button id="edit-toggle" type="button" class="ghost"><span class="edit-icon">+</span><span class="edit-label">즐겨찾기 편집</span></button>
      <div class="foot-right">
        <span id="who" class="who"></span>
        <button id="logout" type="button" class="ghost hidden">로그아웃</button>
        <button id="theme-toggle" type="button" class="ghost">라이트 모드</button>
      </div>
    </footer>

  </div>
</div>

<!-- 로그인 -->
<div id="auth" class="auth hidden">
  <form id="login" class="auth-card">
    <div class="auth-title">시작 페이지</div>
    <div class="auth-desc">즐겨찾기와 할 일을 모든 PC에서 같이 쓰려면 로그인하세요.</div>
    <input id="login-email" type="email" placeholder="이메일" required />
    <button type="submit" class="btn-accent">로그인 링크 받기</button>
    <div id="auth-status" class="auth-status"></div>
  </form>
</div>

<div id="status" class="status"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
